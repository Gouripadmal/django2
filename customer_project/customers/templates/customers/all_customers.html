<!DOCTYPE html>
<html>
<head>
    <title>All Customers</title>
</head>
<body>

    <h1>All Customers</h1>

    <table border="1">

        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>

        {% for customer in customers %}

        <tr>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="2">No customers found.</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="{% url 'add_customer' %}">
        Add Customer
    </a>

    <br>

    <a href="{% url 'filtered_customers' %}">
        View Example.com Customers
    </a>

</body>
</html>
