<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

</head>

<body>

    <h1>Edit Student</h1>

    <hr>

    <form method="POST">

        {% csrf_token %}


        <label>
            Student Name:
        </label>

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            required
        >

        <br><br>


        <label>
            Class:
        </label>

        <input
            type="text"
            name="student_class"
            value="{{ student.student_class }}"
            required
        >

        <br><br>


        <label>
            Age:
        </label>

        <input
            type="number"
            name="age"
            value="{{ student.age }}"
            required
        >

        <br><br>


        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back to Student List
    </a>

</body>

</html>
