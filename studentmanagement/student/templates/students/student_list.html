<!DOCTYPE html>
<html>

<head>

    <title>Student Management</title>

</head>

<body>

    <h1>Student Management System</h1>

    <hr>

    <h2>Student List</h2>

    <a href="{% url 'add_student' %}">
        Add New Student
    </a>

    <br><br>


    <!-- Search -->

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search student by name"
            value="{{ search|default:'' }}"
        >

        <button type="submit">
            Search
        </button>

    </form>

    <br>


    <!-- Student table -->

    <table border="1" cellpadding="10">

        <tr>

            <th>Name</th>

            <th>Class</th>

            <th>Age</th>

            <th>Actions</th>

        </tr>


        {% for student in students %}

        <tr>

            <td>
                {{ student.name }}
            </td>

            <td>
                {{ student.student_class }}
            </td>

            <td>
                {{ student.age }}
            </td>

            <td>

                <a href="{% url 'edit_student' student.id %}">
                    Edit
                </a>

                &nbsp; | &nbsp;

                <a href="{% url 'delete_student' student.id %}">
                    Delete
                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4">
                No students found.
            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
