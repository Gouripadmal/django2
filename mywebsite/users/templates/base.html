<!DOCTYPE html>
<html>

<head>

    <title>My Website</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 17px;
        }

        nav a:hover {
            color: yellow;
        }

        .content {
            padding: 30px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <a href="{% url 'home' %}">
            Home
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'visit_counter' %}">
                Visit Counter
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'signup' %}">
                Sign Up
            </a>

            <a href="{% url 'login' %}">
                Login
            </a>

        {% endif %}

    </nav>


    <!-- PAGE CONTENT -->

    <div class="content">

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
