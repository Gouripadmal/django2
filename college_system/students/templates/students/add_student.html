<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

    <h1>Add Student</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Student Name:</label>
        <input type="text" name="student_name">

        <br><br>

        <button type="submit">Submit</button>
    </form>

    <br>

    <a href="{% url 'students:student_list' message='Welcome Students' %}">
        Back to Students
    </a>

</body>
</html>
