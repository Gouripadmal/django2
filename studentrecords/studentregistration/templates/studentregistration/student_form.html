<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .success {
            color: green;
            background-color: #e8f5e9;
            padding: 10px;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            background-color: #ffebee;
            padding: 10px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if message %}
        <div class="success">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register Student
        </button>

    </form>

</div>

</body>

</html>
